name: Daily Commit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update activity
        run: |
          set -euo pipefail

          mkdir -p .github

          date -u +"%Y-%m-%d" > .github/activity

          git config user.name "hosam-mokhtar"
          git config user.email "hossam.mokhtar.fcis@gmail.com"

          git add .github/activity

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: daily activity - $(date -u +%Y-%m-%d)"
          git push
